<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="t" width="240" height="240" patternUnits="userSpaceOnUse">
      <rect width="240" height="240" fill="#F7F4EE"/>
      <!-- corner quarter-medallions so the tile seams into a full flower -->
      <g fill="none" stroke="#1E4D8C" stroke-width="3">
        <circle cx="0" cy="0" r="34"/>
        <circle cx="240" cy="0" r="34"/>
        <circle cx="0" cy="240" r="34"/>
        <circle cx="240" cy="240" r="34"/>
        <circle cx="120" cy="120" r="44"/>
        <circle cx="120" cy="120" r="22"/>
      </g>
      <!-- petals around centre -->
      <g fill="#1E4D8C">
        <circle cx="120" cy="62" r="8"/>
        <circle cx="120" cy="178" r="8"/>
        <circle cx="62" cy="120" r="8"/>
        <circle cx="178" cy="120" r="8"/>
        <circle cx="79" cy="79" r="6"/>
        <circle cx="161" cy="79" r="6"/>
        <circle cx="79" cy="161" r="6"/>
        <circle cx="161" cy="161" r="6"/>
        <!-- corner dots -->
        <circle cx="0" cy="0" r="10"/>
        <circle cx="240" cy="0" r="10"/>
        <circle cx="0" cy="240" r="10"/>
        <circle cx="240" cy="240" r="10"/>
      </g>
      <!-- leafy cobalt scrolls -->
      <g fill="none" stroke="#1E4D8C" stroke-width="2.2">
        <path d="M120 76 C132 96 144 100 164 100"/>
        <path d="M120 76 C108 96 96 100 76 100"/>
        <path d="M120 164 C132 144 144 140 164 140"/>
        <path d="M120 164 C108 144 96 140 76 140"/>
        <path d="M76 120 C96 108 100 96 100 76"/>
        <path d="M164 120 C144 108 140 96 140 76"/>
        <path d="M76 120 C96 132 100 144 100 164"/>
        <path d="M164 120 C144 132 140 144 140 164"/>
      </g>
      <!-- colorful but small accents -->
      <circle cx="120" cy="120" r="6" fill="#E5097F"/>
      <circle cx="120" cy="36" r="3.5" fill="#F5C518"/>
      <circle cx="120" cy="204" r="3.5" fill="#F5C518"/>
      <circle cx="36" cy="120" r="3.5" fill="#0B6E48"/>
      <circle cx="204" cy="120" r="3.5" fill="#0B6E48"/>
      <circle cx="40" cy="40" r="3" fill="#17A8B4"/>
      <circle cx="200" cy="40" r="3" fill="#17A8B4"/>
      <circle cx="40" cy="200" r="3" fill="#17A8B4"/>
      <circle cx="200" cy="200" r="3" fill="#17A8B4"/>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="url(#t)"/>
</svg>
